<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Acesso da equipe — Central de TI</title>
  <meta name="description" content="Área restrita para analistas, técnicos e gestores da Central de TI." />
  <meta property="og:title" content="Acesso da equipe — Central de TI" />
  <meta property="og:description" content="Entre para acompanhar chamados, SLA e indicadores da operação." />
  <link rel="icon" href="assets/img/favicon.ico" type="image/x-icon" />

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
  <div class="d-flex min-vh-100 align-items-center justify-content-center px-3 py-5"
       style="background-color: color-mix(in oklch, var(--secondary) 60%, transparent);">
    <div class="w-100 container-form">

      <a href="/" class="d-flex align-items-center justify-content-center gap-2 text-decoration-none mb-4">
        <span class="d-inline-flex align-items-center justify-content-center rounded-3 bg-primary text-white" style="width:2.5rem;height:2.5rem;">
          <i class="bi bi-life-preserver fs-5" aria-hidden="true"></i>
        </span>
        <span class="font-display fs-5 fw-semibold text-body">Central de TI</span>
      </a>

      <div class="card p-4">
        <div class="mb-1">
          <h1 class="fs-5 fw-semibold mb-1">Acesso da equipe</h1>
          <p class="small text-muted-fg mb-0">Entre com seu e-mail cadastrado ou com o usuário admin.</p>
        </div>

        <form id="login-form" class="mt-4 d-flex flex-column gap-3" novalidate>

          <div>
            <label for="email" class="form-label">E-mail ou usuário</label>
            <input type="text" id="email" class="form-control" autocomplete="username" />
          </div>

          <div>
            <label for="senha" class="form-label">Senha</label>
            <div class="position-relative">
              <input type="password" id="senha" class="form-control" autocomplete="current-password" style="padding-right: 2.5rem;" />
              <button type="button" id="toggle-senha"
                      class="btn btn-sm position-absolute top-50 end-0 translate-middle-y me-1 p-1 text-muted-fg border-0"
                      aria-label="Mostrar senha">
                <i class="bi bi-eye" aria-hidden="true"></i>
              </button>
            </div>
          </div>

          <div class="d-flex align-items-center justify-content-between">
            <label class="d-flex align-items-center gap-2 small mb-0" for="lembrar">
              <input type="checkbox" id="lembrar" class="form-check-input mt-0" checked />
              <span>Lembrar de mim</span>
            </label>
            <button type="button" id="btn-esqueci" class="btn-link-quiet small border-0 bg-transparent">Esqueci minha senha</button>
          </div>

          <button type="submit" id="btn-entrar" class="btn btn-primary w-100 d-flex align-items-center justify-content-center gap-2">
            <span id="spinner-entrar" class="spinner-border spinner-border-sm d-none" aria-hidden="true"></span>
            <span id="texto-entrar">Entrar</span>
          </button>
        </form>


      </div>

      <p class="mt-4 text-center small text-muted-fg">
        É colaborador?
        <a href="/" class="fw-medium text-decoration-none">Abrir um chamado</a>
      </p>
    </div>
  </div>

  {% include 'partials/alerts.html' %}
  <script src="{{ url_for('static', filename='js/data.js') }}"></script>
  <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
  <script src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>
</html>
